<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معاينة — دائرة نجاح الطلب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Consolas&display=swap" rel="stylesheet">
<style>
:root{
  --t1:#0d1b2a; --t3:#4a6785;
  --bg1:#f0f4fa;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
  font-family:'Tajawal',sans-serif; background:var(--bg1); padding:20px;
}
.stage{ width:100%; max-width:380px; }

/* ═══ نفس الكلاسات المضافة بالضبط في portal.css ═══ */
.portal-card{ background:#fff; border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.05); padding:4px; }
.portal-submit-ok {
  margin-top: 0; padding: 26px 18px 20px; text-align: center; color: var(--t1, #0f172a);
  background: linear-gradient(180deg, #f0fdf4, #ecfdf5);
  border: 1px solid #bbf7d0; border-radius: 14px;
}
.portal-submit-ok b { font-size: 16px; display: block; margin-bottom: 4px; }

.portal-celebrate-circle {
  width: 76px; height: 76px; margin: 0 auto 14px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0a8a5c, #0dbf84);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 16px 40px rgba(10, 138, 92, .35);
  animation: portal-celebrate-pop .45s cubic-bezier(.34, 1.56, .64, 1) backwards;
}
.portal-celebrate-circle svg {
  width: 36px; height: 36px;
  stroke: #fff; stroke-width: 2.6; fill: none;
  stroke-linecap: round; stroke-linejoin: round;
}
.portal-celebrate-circle .pcc-check {
  stroke-dasharray: 40; stroke-dashoffset: 40;
  animation: portal-celebrate-draw .35s ease .25s forwards;
}
@keyframes portal-celebrate-pop {
  from { transform: scale(0); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
@keyframes portal-celebrate-draw {
  to { stroke-dashoffset: 0; }
}
.portal-submit-ref {
  display: inline-block; margin-block: 4px 8px; padding: 3px 10px;
  font-family: Consolas, monospace; font-size: 13px; color: #166534;
  background: #dcfce7; border-radius: 8px;
}
.portal-submit-hint{ font-size:12px; color:var(--t3); margin-top:10px; }

/* ── تحكم المعاينة (مو جزء من الكود الحقيقي) ── */
.replay-btn{
  display:flex; align-items:center; justify-content:center; gap:8px; margin:18px auto 0;
  padding:11px 22px; border-radius:999px; border:none; cursor:pointer;
  background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.08);
  font-family:'Tajawal',sans-serif; font-size:13px; font-weight:700; color:var(--t3);
}
.replay-btn:active{ transform:scale(.97); }
.note{ text-align:center; font-size:11.5px; color:var(--t3); margin-top:14px; opacity:.75; }
</style>
</head>
<body>
<div class="stage">
  <div class="portal-card">
    <div class="portal-submit-ok" id="okBlock">
      <div class="portal-celebrate-circle" id="circle" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path class="pcc-check" id="check" d="M5 13l4 4L19 7" /></svg>
      </div>
      <b>تم إرسال طلبك بنجاح</b>
      <div>
        رقم طلبك: <span class="portal-submit-ref">CMD-2026-000412</span>
      </div>
      <div class="portal-submit-hint">سنتواصل معك قريباً لتأكيد الطلب والتوصيل</div>
    </div>
  </div>
  <button class="replay-btn" onclick="replay()">
    <span>↻</span> إعادة تشغيل الحركة
  </button>
  <div class="note">هذا نفس الكود بالضبط اللي أضفناه في portal.css — معاينة معزولة قبل التطبيق</div>
</div>

<script>
function replay(){
  const circle = document.getElementById('circle');
  const check = document.getElementById('check');
  circle.style.animation = 'none';
  check.style.animation = 'none';
  void circle.offsetWidth; // إعادة تشغيل قسرية
  circle.style.animation = '';
  check.style.animation = '';
}
</script>
</body>
</html>
